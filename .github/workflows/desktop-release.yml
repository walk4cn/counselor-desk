name: Validate and prepare release

on:
  push:
    tags: ['v4.4.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to validate and package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: counselor-desk-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify version tag and source surface
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="${{ inputs.release_tag || github.ref_name }}"
          test "$tag" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pnpm run lint
          pnpm run check:public
          pnpm run check:secrets
      - name: Run complete release test gate
        run: xvfb-run -a pnpm test
      - name: Verify release configuration
        run: pnpm run test:release

  windows:
    name: Windows NSIS (x64 and ARM64)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installers
        run: pnpm run desktop:build:win
      - name: Verify Windows packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath output/desktop -File -Filter 'counselor-desk-*-*.exe'
          if ($packages.Count -lt 2) { throw 'Expected x64 and arm64 NSIS installers.' }
          $x64 = $packages | Where-Object { $_.Name -match 'x64' } | Select-Object -First 1
          $arm64 = $packages | Where-Object { $_.Name -match 'arm64' } | Select-Object -First 1
          if (-not $x64 -or -not $arm64) { throw 'Both x64 and arm64 installers are required.' }
          $env:CWB_DESKTOP_ARTIFACT_DIR = (Resolve-Path output/desktop).Path
          $env:CWB_REQUIRE_ARTIFACTS = '1'
          pnpm exec node tests/desktop-windows-architecture.js
          pnpm exec node tests/desktop-packaged-smoke.js
          pnpm exec node tests/desktop-installer-smoke.js
          @($x64, $arm64) | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash + ' *' + $_.Name } | Set-Content output/desktop/Windows-SHA256.txt -Encoding utf8
      - uses: actions/upload-artifact@v5
        with:
          name: windows-v${{ needs.validate.outputs.version }}
          path: |
            output/desktop/counselor-desk-*-x64.exe
            output/desktop/counselor-desk-*-arm64.exe
            output/desktop/Windows-SHA256.txt
          if-no-files-found: error

  macos:
    name: macOS Universal (DMG and ZIP)
    needs: [validate, windows]
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build universal desktop package
        shell: bash
        run: |
          set -euo pipefail
          build_log="mac-build.log"
          for attempt in 1 2; do
            rm -rf output/desktop
            if pnpm run desktop:build:mac 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            while read -r disk; do
              [ -n "$disk" ] && hdiutil detach "$disk" -force || true
            done < <(grep -oE 'disk[0-9]+' "$build_log" | sort -u)
            sleep 5
          done
      - name: Verify universal artifacts and smoke paths
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find output/desktop -maxdepth 1 -name 'counselor-desk-*-mac-universal.dmg' -print -quit)"
          zip="$(find output/desktop -maxdepth 1 -name 'counselor-desk-*-mac-universal.zip' -print -quit)"
          test -n "$dmg" && test -n "$zip"
          unzip -q "$zip" -d mac-app
          app="$(find mac-app -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          test -n "$binary"
          lipo -archs "$binary" | grep -q x86_64
          lipo -archs "$binary" | grep -q arm64
          chmod +x "$binary"
          CWB_DESKTOP_EXECUTABLE="$binary" CWB_REQUIRE_ARTIFACTS=1 pnpm exec node tests/desktop-packaged-smoke.js
          hdiutil attach "$dmg" -nobrowse -mountpoint mounted-dmg
          mounted_app="$(find mounted-dmg -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$mounted_app"
          mounted_binary="$(find "$mounted_app/Contents/MacOS" -type f -perm -111 -print -quit)"
          test -n "$mounted_binary"
          CWB_DESKTOP_EXECUTABLE="$mounted_binary" CWB_REQUIRE_ARTIFACTS=1 pnpm exec node tests/desktop-packaged-smoke.js
          hdiutil detach mounted-dmg
          shasum -a 256 "$dmg" "$zip" > output/desktop/macOS-SHA256.txt
      - uses: actions/upload-artifact@v5
        with:
          name: macos-v${{ needs.validate.outputs.version }}
          path: |
            output/desktop/*-mac-universal.dmg
            output/desktop/*-mac-universal.zip
            output/desktop/macOS-SHA256.txt
          if-no-files-found: error

  web:
    name: Offline web package
    needs: [validate, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:release
      - run: sha256sum output/辅导员工作台.html > output/Web-SHA256.txt
      - uses: actions/upload-artifact@v5
        with:
          name: web-v${{ needs.validate.outputs.version }}
          path: |
            output/辅导员工作台.html
            output/Web-SHA256.txt
          if-no-files-found: error

  release:
    name: Draft Release
    needs: [validate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Create one draft release after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          version='${{ needs.validate.outputs.version }}'
          web_html="$(find release-assets -type f -name '*.html' -print -quit)"
          test -n "$web_html"
          mv "$web_html" "release-assets/CounselorDesk-v$version-Offline.html"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1 }
            found && $0 ~ /^## \[/ && $0 !~ "^## \\[" version "\\]" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\n## Release boundaries\n\n- Windows x64 / ARM64 NSIS installers and macOS Universal DMG / ZIP are unsigned.\n- macOS packages are not notarized. Verify the accompanying SHA-256 manifests before installation.\n' >> release-notes.md
          existing_release="$(gh release view "$tag" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv' 2>/dev/null || true)"
          if [ -n "$existing_release" ]; then
            IFS=$'\t' read -r is_draft is_prerelease <<< "$existing_release"
            if [ "$is_draft" != "true" ] || [ "$is_prerelease" = "true" ]; then
              echo "Refusing to replace an existing published or prerelease Release: $tag"
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          mapfile -t assets < <(find release-assets -type f -print | sort)
          test "${#assets[@]}" -gt 0
          gh release create "$tag" --draft --verify-tag --title "辅导员工作台 v$version" --notes-file release-notes.md "${assets[@]}"
