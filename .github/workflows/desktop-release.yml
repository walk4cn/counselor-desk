name: Validate and prepare v4.4 release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to validate and package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: counselor-desk-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify version tag and source surface
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p \"require('./package.json').version\")"
          tag="${{ inputs.release_tag || github.ref_name }}"
          test "$tag" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pnpm run lint
          pnpm run check:public
      - name: Run complete v4.4 test gate
        run: pnpm test
      - name: Verify release configuration
        run: pnpm run test:release

  windows:
    name: Windows NSIS (x64 and ARM64)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installers
        run: pnpm run desktop:build:win
      - name: Verify Windows packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath output/desktop -File -Filter 'counselor-desk-*-*.exe'
          if ($packages.Count -lt 2) { throw 'Expected x64 and arm64 NSIS installers.' }
          $x64 = $packages | Where-Object { $_.Name -match 'x64' } | Select-Object -First 1
          $arm64 = $packages | Where-Object { $_.Name -match 'arm64' } | Select-Object -First 1
          if (-not $x64 -or -not $arm64) { throw 'Both x64 and arm64 installers are required.' }
          $env:CWB_DESKTOP_ARTIFACT_DIR = (Resolve-Path output/desktop).Path
          pnpm exec node tests/desktop-packaged-smoke.js
          pnpm exec node tests/desktop-installer-smoke.js
          @($x64, $arm64) | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash + ' *' + $_.Name } | Set-Content output/desktop/Windows-SHA256.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-v4.4
          path: |
            output/desktop/*.exe
            output/desktop/Windows-SHA256.txt
          if-no-files-found: error

  macos:
    name: macOS Universal (DMG and ZIP)
    needs: windows
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build universal desktop package
        run: pnpm run desktop:build:mac
      - name: Verify universal artifacts and smoke paths
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find output/desktop -maxdepth 1 -name 'counselor-desk-*-mac-universal.dmg' -print -quit)"
          zip="$(find output/desktop -maxdepth 1 -name 'counselor-desk-*-mac-universal.zip' -print -quit)"
          test -n "$dmg" && test -n "$zip"
          unzip -q "$zip" -d mac-app
          app="$(find mac-app -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          test -n "$binary"
          lipo -archs "$binary" | grep -q x86_64
          lipo -archs "$binary" | grep -q arm64
          hdiutil attach "$dmg" -nobrowse -mountpoint mounted-dmg
          test -n "$(find mounted-dmg -maxdepth 2 -name '*.app' -print -quit)"
          hdiutil detach mounted-dmg
          shasum -a 256 "$dmg" "$zip" > output/desktop/macOS-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-v4.4
          path: |
            output/desktop/*-mac-universal.dmg
            output/desktop/*-mac-universal.zip
            output/desktop/macOS-SHA256.txt
          if-no-files-found: error

  web:
    name: Offline web package
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:release
      - run: sha256sum output/辅导员工作台.html > output/Web-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-v4.4
          path: |
            output/辅导员工作台.html
            output/Web-SHA256.txt
          if-no-files-found: error

  release:
    name: Draft Release
    needs: [validate, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create one draft release after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          version='${{ needs.validate.outputs.version }}'
          gh release create "$tag" --draft --verify-tag --title "辅导员工作台 v$version" --notes "v$version 已完成自动化发布门禁，等待人工确认后公开。未配置代码签名或公证时，发布页会明确标注未签名。" release-assets/**/*
